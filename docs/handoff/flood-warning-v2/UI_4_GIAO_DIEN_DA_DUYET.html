284" fill="#ffe2ac" font-family="Segoe UI,Arial" font-size="12" font-weight="600">HÒA XUÂN</text><text x="355" y="100" fill="#b8cfd9" font-family="Segoe UI,Arial" font-size="13" letter-spacing="2">ĐÀ NẴNG</text><text x="285" y="390" fill="#6da3b8" font-family="Segoe UI,Arial" font-size="10" transform="rotate(-78 285 390)">SÔNG CẨM LỆ</text><path d="M554 30v28m0-28-6 9m6-9 6 9" stroke="#a9c1ca" stroke-width="1.5"/><text x="550" y="22" font-size="9" fill="#a9c1ca">B</text></svg>${user?`<span class="map-pin ${gps}" style="left:${pos[0]}%;top:${pos[1]}%"></span>`:''}<span class="map-label">Sơ đồ minh họa · Không dùng để chỉ đường</span></div>`;}
function legend(){return `<div class="map-legend"><div class="legend-item"><span class="legend-name"><i class="swatch"></i>Vùng ngập hiện tại</span><span>Được ghi nhận</span></div><div class="legend-item"><span class="legend-name"><i class="swatch history"></i>Vùng ngập lịch sử</span><span>Từng ghi nhận ngập</span></div><div class="legend-item"><span class="legend-name"><i class="swatch low"></i>Vùng trũng</span><span>Lớp dữ liệu radar</span></div></div>`;}
function sidebar(admin){const nav=admin?[['grid','Tổng quan'],['map','Bản đồ trực quan'],['history','Bản đồ lịch sử'],['alert','Theo dõi SOS'],['bell','Quản lý cảnh báo lũ',true],['waves','Quản lý vùng ngập'],['shield','Quản lý điểm an toàn'],['users','Quản lý người dùng'],['file','Báo cáo']]:[['grid','Tổng quan'],['map','Bản đồ cứu hộ'],['alert','Yêu cầu SOS'],['history','Lịch sử cứu hộ'],['shield','Điểm tránh trú'],['bell','Cảnh báo lũ',true]];return `<aside class="sidebar">${brand(admin?'HỆ THỐNG QUẢN TRỊ':'KHU VỰC CỨU HỘ')}<div><span class="side-role">${admin?'ADMIN':'RESCUE'}</span></div><div class="side-label">${admin?'Điều hành hệ thống':'Không gian làm việc'}</div><nav class="side-nav">${nav.map(([i,t,a])=>`<div class="side-item ${a?'active':'inert'}">${icon(i)}<span>${t}</span></div>`).join('')}</nav><div class="side-user"><div class="avatar">${admin?'QT':'CH'}</div><div><div class="user-name">${admin?'Quản trị FLOODGUARD':'Đội cứu hộ Hải Châu'}</div><div class="user-role">${admin?'Quản trị viên':'Nhân viên cứu hộ'}</div></div></div></aside>`;}
function appbar(admin){return `<div class="appbar"><div class="breadcrumb">${admin?'Hệ thống quản trị':'Khu vực cứu hộ'} <strong>/ ${admin?'Quản lý cảnh báo lũ':'Cảnh báo lũ'}</strong></div><div class="appbar-right"><span class="clock">${icon('clock')} &nbsp; 18:30 ICT</span>${icon('bell')}<div class="avatar">${admin?'QT':'CH'}</div></div></div>`;}
function filters(){return `<div class="filterbar"><label class="search">${icon('search')}<input aria-label="Tìm cảnh báo" id="search" placeholder="Tìm theo tiêu đề hoặc nội dung…" value="${esc(state.query)}"></label>${segments()}</div>`;}
function segments(){return `<div class="segments" aria-label="Lọc trạng thái">${[['all','Tất cả'],['on','Đang bật'],['off','Đã tắt']].map(([k,t])=>`<button class="segment ${state.filter===k?'active':''}" data-filter="${k}">${t}</button>`).join('')}</div>`;}
function filtered(){return state.alerts.filter(a=>(state.filter==='all'||a.active===(state.filter==='on'))&&(!state.query||(a.title+' '+a.content).toLocaleLowerCase('vi').includes(state.query.toLocaleLowerCase('vi'))));}
function renderAdmin(){return `<section class="product web-product"><div class="desktop">${sidebar(true)}<div class="workspace">${appbar(true)}<div class="app-body"><div class="page-head"><div><div class="kicker">ADMIN · CẢNH BÁO LŨ</div><h2>Quản lý cảnh báo lũ</h2><p>Phát bản tin mưa lớn và nguy cơ ngập đến toàn bộ Người dân.</p></div><div class="actions"><button class="btn subtle" data-action="refresh">${icon('refresh')}Làm mới</button><button class="btn primary" data-action="create">${icon('plus')}Tạo cảnh báo</button></div></div><div class="stats"><div class="stat"><div><div class="stat-label">Tổng bản tin</div><div class="stat-value">${state.alerts.length}</div></div><span class="stat-icon">${icon('file')}</span></div><div class="stat"><div><div class="stat-label">Đang bật</div><div class="stat-value green">${state.alerts.filter(a=>a.active).length}</div></div><span class="stat-icon green">${icon('bell')}</span></div><div class="stat"><div><div class="stat-label">Đã tắt</div><div class="stat-value muted">${state.alerts.filter(a=>!a.active).length}</div></div><span class="stat-icon gray">${icon('history')}</span></div></div>${filters()}<section class="panel"><div class="panel-title"><span>Danh sách cảnh báo</span><small>${filtered().length} bản tin · Giờ Việt Nam</small></div><table><thead><tr><th class="table-title">BẢN TIN</th><th class="table-status">TRẠNG THÁI</th><th class="table-date">BẮT ĐẦU</th><th class="table-date">KẾT THÚC</th><th class="table-actions">THAO TÁC</th></tr></thead><tbody>${filtered().map(a=>`<tr><td><strong>${esc(a.title)}</strong><p>${a.id}</p><p>Toàn bộ vùng trên bản đồ</p></td><td>${pill(a)}</td><td class="date">${esc(a.start.split(' · ')[0])}<small>${esc(a.start.split(' · ')[1])} ICT</small></td><td class="date">${a.end?`${esc(a.end.split(' · ')[0])}<small>${esc(a.end.split(' · ')[1])} ICT</small>`:'<span class="muted">—</span><small>Đang có hiệu lực</small>'}</td><td><div class="actions"><button class="btn sm" data-detail="${a.id}">Chi tiết</button>${a.active?`<button class="btn danger sm" data-stop="${a.id}">Tắt</button>`:''}</div></td></tr>`).join('')||'<tr><td colspan="5" class="table-empty">Không tìm thấy bản tin phù hợp.</td></tr>'}</tbody></table></section><div class="scope-note">${icon('layers')}<div><strong>Phạm vi áp dụng: tất cả các vùng trên bản đồ</strong><br>Vùng ngập hiện tại, vùng ngập lịch sử và vùng trũng. Thời điểm bắt đầu được ghi khi tạo; thời điểm kết thúc được ghi khi tắt.</div></div><div class="update-line"><span>Nguồn bản tin: Admin FLOODGUARD</span><span>Dữ liệu mẫu · GMT+7</span></div></div></div></div></section>`;}
function webCard(a){return `<article class="warning-card ${a.active?'current':''}"><div class="card-top">${pill(a)}<small>${esc(a.start)}</small></div><h3>${esc(a.title)}</h3><p>${esc(a.content.split('\n')[0])}</p><div class="card-meta">${icon('layers')}<span>Toàn bộ vùng trên bản đồ</span></div><div class="actions"><button class="btn sm" data-detail="${a.id}">Xem chi tiết</button><button class="btn map-btn sm" data-map="${a.id}">${icon('map')}Xem bản đồ</button></div>${a.end?`<div class="card-footer"><span>Kết thúc: ${esc(a.end)}</span></div>`:''}</article>`;}
function renderRescueWeb(){return `<section class="product web-product"><div class="desktop">${sidebar(false)}<div class="workspace">${appbar(false)}<div class="app-body"><div class="page-head"><div><div class="kicker">RESCUE · THEO DÕI TÌNH HÌNH</div><h2>Cảnh báo lũ</h2><p>Theo dõi bản tin và các vùng cần chú ý để hỗ trợ công tác cứu hộ.</p><div class="view-readonly">${icon('eye')}Thông tin do Admin FLOODGUARD cung cấp</div></div><button class="btn subtle" data-action="refresh">${icon('refresh')}Làm mới</button></div>${filters()}<div class="rescue-layout"><div class="alert-stack">${filtered().map(webCard).join('')||'<div class="panel no-results">Không có bản tin phù hợp.</div>'}</div><aside class="panel rescue-map-panel"><div class="panel-title"><span>Các vùng trên bản đồ</span><small>3 lớp dữ liệu</small></div><div class="desktop-map">${mapArt()}</div>${legend()}<div class="map-caption">Chọn “Xem bản đồ” để tra cứu đầy đủ phạm vi vùng và nội dung bản tin.</div></aside></div><div class="update-line"><span>Nguồn: Admin FLOODGUARD</span><span>Dữ liệu mẫu · GMT+7</span></div></div></div></div></section>`;}
function locationBox(){const a=current();if(!a)return `<div class="end-banner">${icon('check')} &nbsp; Hiện không có bản tin đang bật. Cảnh báo vị trí theo bản tin đã dừng.</div>`;if(state.gps==='unknown')return `<div class="location-neutral">${icon('pin')}<div><h4>Chưa xác định được vị trí</h4><p>Bạn vẫn nhận bản tin chung. Cho phép vị trí để biết mình đang trong hoặc gần vùng nào.</p><button class="mobile-list-btn" style="margin-top:9px" data-action="enable-gps">Cập nhật vị trí</button></div></div>`;if(state.gps==='far')return `<div class="location-neutral">${icon('pin')}<div><h4>Đã đối chiếu GPS hiện tại</h4><p>Chưa ghi nhận vùng trong phạm vi 500 m từ vị trí này. Bạn vẫn cần theo dõi nội dung bản tin.</p></div></div>`;let z=zoneNames[state.zone];let text=state.zone==='history'?'Khu vực từng ghi nhận ngập. Cần chú ý khi có mưa lớn.':state.zone==='current'?'Khu vực được hệ thống ghi nhận ngập. Theo dõi hướng dẫn trong bản tin.':'Có nguy cơ ngập khi mưa lớn. Chủ động theo dõi tình hình và hướng dẫn.';return `<section class="location-alert"><div class="location-kicker">${icon('alert')}Cảnh báo theo vị trí của bạn</div><h3>Bạn đang ${state.gps==='inside'?'trong':'gần'} ${z}</h3><p>${text}</p><div class="location-distance"><b>${state.gps==='inside'?'Trong vùng':state.distance+' m'}</b><span>${state.gps==='inside'?'Theo GPS hiện tại':'tới ranh giới gần nhất'}</span></div><div class="location-footer"><span>GPS cập nhật lúc 18:31</span><button data-action="mobile-map">Xem vị trí trên bản đồ</button></div></section>`;}
function mobileCard(a,resident=false){return `<article class="warning-card ${a.active?'current':''}"><div class="card-top">${pill(a)}<small>${resident?'BẢN TIN CHUNG':'ADMIN FLOODGUARD'}</small></div><h3>${esc(a.title)}</h3><div class="card-meta">${icon('clock')}<span>Bắt đầu: ${esc(a.start)}${a.end?`<br>Kết thúc: ${esc(a.end)}`:''}</span></div><p>${esc(a.content.split('\n')[0])}</p><div class="card-meta">${icon('layers')}<span>Toàn bộ vùng trên bản đồ</span></div><div class="card-footer"><span>${a.active?'Theo dõi đến khi có cập nhật':'Bản tin đã kết thúc'}</span><button data-mobile-detail="${a.id}">Xem chi tiết</button></div></article>`;}
function mobileHome(){const a=current();return `<div class="phone-head"><div><h2>Cảnh báo &amp; thông tin</h2><p>Bản tin từ Admin FLOODGUARD</p></div><button class="mobile-refresh" data-action="refresh">${icon('refresh')}Tải lại</button></div>${locationBox()}<div class="section-title">Bản tin trên hệ thống</div>${a?mobileCard(a,true):`<div class="empty-mobile">${icon('bell')}<h3>Chưa có bản tin đang bật</h3><p>Bạn có thể xem lại các bản tin đã tắt trong danh sách cảnh báo.</p></div>`}<button class="btn wide subtle" data-action="mobile-list">Danh sách cảnh báo</button><div class="section-title">Bản đồ &amp; vị trí</div><button class="section-link" data-action="mobile-map">${icon('map')}Xem các vùng trên bản đồ</button><div class="section-title">Tra cứu &amp; hỗ trợ</div><button class="section-link" data-action="shelter">${icon('shield')}Điểm tránh trú</button>`;}
function mobileList(resident){return `<div class="phone-head"><div><h2>Cảnh báo lũ</h2><p>${state.alerts.filter(a=>a.active).length} đang bật · ${state.alerts.length} bản tin</p></div><button class="mobile-refresh" data-action="refresh">${icon('refresh')}Làm mới</button></div>${!resident?'<div class="mobile-note"><strong>Nguồn: Admin FLOODGUARD</strong><br>Theo dõi thông tin và phạm vi các vùng trên bản đồ.</div>':''}${segments()}${filtered().map(a=>mobileCard(a,resident)).join('')||`<div class="empty-mobile">${icon('bell')}<h3>Không có bản tin phù hợp</h3><p>Thử chọn trạng thái khác hoặc làm mới.</p></div>`}`;}
function mobileDetail(resident){const a=selected();if(!a)return mobileList(resident);return `<button class="backline" data-action="mobile-back">${icon('back')}${state.routeHistory.at(-1)==='home'?'Tổng quan':'Danh sách cảnh báo'}</button>${pill(a)}<h2 class="detail-title">${esc(a.title)}</h2>${!a.active?'<div class="end-banner">Bản tin đã được Admin tắt. Cảnh báo theo bản tin này đã dừng.</div>':''}<div class="detail-time"><div><small>BẮT ĐẦU · GMT+7</small><b>${esc(a.start)}</b></div><div><small>KẾT THÚC · GMT+7</small><b>${a.end?esc(a.end):'Đang có hiệu lực'}</b></div></div>${resident&&a.active?locationBox():''}<section class="detail-section"><h4>Nội dung cảnh báo</h4><p>${esc(a.content)}</p><h4>Phạm vi áp dụng</h4><p>Toàn bộ các vùng được hệ thống cung cấp trên bản đồ.</p>${chips()}<button class="btn map-btn wide" data-action="mobile-map">${icon('map')}Xem vùng trên bản đồ</button></section><div class="phone-ribbon">Nguồn: Admin FLOODGUARD · ${a.id}</div>`;}
function mobileMap(resident){return `<button class="backline" data-action="mobile-back">${icon('back')}Quay lại cảnh báo</button><div class="phone-head"><div><h2>Bản đồ các vùng</h2><p>Vùng ngập, ngập lịch sử và vùng trũng</p></div></div><div class="map-wrap full-mobile">${mapArt(resident)}</div>${legend()}${resident?locationBox():'<div class="mobile-note">Thông tin các vùng được cung cấp để tham khảo tình hình và hỗ trợ công tác cứu hộ.</div>'}`;}
function phoneNav(resident){return `<nav class="phone-nav" aria-label="Điều hướng ứng dụng">${resident?`<button class="${state.route==='home'?'active':''}" data-action="mobile-home">${icon('home')}Tổng quan</button><button class="${state.route==='map'?'active':''}" data-action="mobile-map">${icon('map')}Bản đồ</button><button class="sos-nav" data-action="sos"><span class="sos-round">SOS</span>Cứu hộ</button><button data-action="shelter">${icon('pin')}Tránh trú</button><button data-action="settings">${icon('settings')}Cài đặt</button>`:`<button data-action="overview">${icon('grid')}Tổng quan</button><button class="${state.route==='map'?'active':''}" data-action="mobile-map">${icon('map')}Bản đồ lũ</button><button data-action="sos">${icon('alert')}SOS</button><button data-action="shelter">${icon('shield')}Điểm tránh trú</button>`}</nav>`;}
function phone(resident){return `<div class="phone-column"><section class="phone" aria-label="${resident?'Người dân':'Cứu hộ'} Mobile"><div class="phone-inner"><div class="phone-status"><span>18:31</span><span class="status-icons">${icon('signal')}<span>4G</span><i class="battery"></i></span></div><header class="phone-appbar">${brand(resident?'DÀNH CHO NGƯỜI DÂN':'KHU VỰC CỨU HỘ')}<div><button class="icon-btn" aria-label="Danh sách cảnh báo" data-action="mobile-list">${icon('bell')}${current()?'<i class="unread-dot"></i>':''}</button><button class="icon-btn" aria-label="Tài khoản" data-action="account">${icon('user')}</button></div></header><div class="phone-main">${state.route==='detail'?mobileDetail(resident):state.route==='map'?mobileMap(resident):resident&&state.route==='home'?mobileHome():mobileList(resident)}</div>${phoneNav(resident)}<div class="home-indicator"></div></div></section></div>`;}
function pushPreview(){const a=current();if(!a)return '<div class="push-off">Bản tin đã tắt.<br>Không phát thêm thông báo theo bản tin này.</div>';const near=state.gps==='near'||state.gps==='inside';return `<button class="phone-push" data-mobile-detail="${a.id}"><div class="push-brand"><span class="push-icon">${icon('shield')}</span>FLOODGUARD<time>vừa xong</time></div><div class="push-title">${near?'Bạn đang '+(state.gps==='inside'?'trong':'gần')+' '+zoneNames[state.zone]:esc(a.title)}</div><div class="push-body">${near?(state.gps==='inside'?'Theo GPS hiện tại. ':`Cách ranh giới khoảng ${state.distance} m. `)+'Có bản tin mưa lớn đang bật. Nhấn để xem hướng dẫn.':esc(a.content.split('\n')[0])}</div></button>`;}
function controls(resident){return `<aside class="preview-controls"><div class="control-eyebrow">${resident?'Trải nghiệm người dân':'Trải nghiệm cứu hộ'}</div><h3>${resident?'Bản tin chung,\ncảnh báo riêng.':'Nắm tình hình\nngay trên điện thoại.'}</h3><p>${resident?'Mọi Người dân nhận bản tin. Vị trí trong hoặc gần vùng sẽ có thêm khối cảnh báo đỏ.':'Xem bản tin, nội dung hướng dẫn và các vùng trên bản đồ trong quá trình làm nhiệm vụ.'}</p>${resident?`<div class="control-card"><h4>Thử trạng thái GPS</h4><div class="sim-buttons">${[['inside','Trong vùng'],['near','Gần vùng'],['far','Xa vùng'],['unknown','Chưa có GPS']].map(([k,t])=>`<button class="sim-btn ${k==='inside'||k==='near'?'alert':''} ${state.gps===k?'active':''}" data-gps="${k}">${t}</button>`).join('')}</div><label for="zone-select">Loại vùng đang đối chiếu</label><select id="zone-select">${[['low','Vùng trũng'],['current','Vùng ngập hiện tại'],['history','Vùng ngập lịch sử']].map(([v,t])=>`<option value="${v}" ${state.zone===v?'selected':''}>${t}</option>`).join('')}</select>${state.gps!=='inside'&&state.gps!=='unknown'?`<label for="distance">Khoảng cách tới ranh giới</label><div class="slider-row"><input id="distance" type="range" min="1" max="1000" value="${state.distance}" aria-label="Khoảng cách mô phỏng"><span>${state.distance} m</span></div><div class="presets">${[499,500,501].map(d=>`<button data-distance="${d}">${d} m</button>`).join('')}</div>`:''}<p>Vị trí và khoảng cách ở đây được mô phỏng để duyệt giao diện.</p></div><div class="control-card"><h4>Thông báo trên điện thoại · Mô phỏng</h4>${pushPreview()}<p>Nhấn thông báo để mở chi tiết bản tin.</p></div>`:`<div class="control-card"><h4>Luồng xem bản tin</h4><div class="actions"><button class="control-btn ${state.route==='list'?'':'light'}" data-action="mobile-list">Danh sách</button><button class="control-btn light" data-action="open-current-detail">Chi tiết</button><button class="control-btn light" data-action="mobile-map">Bản đồ</button></div><p>Rescue có quyền xem; thao tác tạo và tắt bản tin nằm ở Admin Web.</p></div>`}<div class="control-card"><h4>Thử luồng Admin → ${resident?'Người dân':'Cứu hộ'}</h4><div class="actions"><button class="control-btn" data-role="admin">Mở Admin Web</button><button class="control-btn light" data-action="simulate-stop">${current()?'Xem khi bản tin đã tắt':'Khôi phục bản đang bật'}</button></div><p>Thay đổi bản tin tại Admin sẽ được phản ánh ở cả bốn giao diện trong bản mẫu.</p></div></aside>`;}
function renderMobile(resident){return `<div class="mobile-layout">${phone(resident)}${controls(resident)}</div>`;}
function render(){document.getElementById('role-tabs').innerHTML=roles.map(r=>`<button class="role-tab ${state.role===r.id?'active':''}" data-role="${r.id}" aria-pressed="${state.role===r.id}"><span class="tab-icon">${icon(r.icon)}</span><span><b>${r.name}</b><small>${r.platform}</small></span></button>`).join('');const r=roles.find(r=>r.id===state.role);document.getElementById('view-label').textContent=r.name+' · '+(r.id.includes('mobile')||r.id==='resident'?'Mobile':'Web');document.getElementById('global-state').textContent=state.alerts.filter(a=>a.active).length+' bản tin đang bật';document.getElementById('stage').innerHTML=state.role==='admin'?renderAdmin():state.role==='rescue-web'?renderRescueWeb():renderMobile(state.role==='resident');renderModal();}
function renderModal(){const root=document.getElementById('modal-root');if(!state.modal){root.innerHTML='';document.body.style.overflow='';return;}document.body.style.overflow='hidden';const m=state.modal,a=selected();let body='',footer='',title='',kicker='',small=false;if(m==='create'||m==='edit'){const edit=m==='edit';kicker='ADMIN · THÔNG TIN CẢNH BÁO';title=edit?'Chỉnh sửa nội dung':'Tạo cảnh báo lũ';body=`<form id="alert-form"><div class="field"><label for="alert-title">Tiêu đề <span style="color:#52d1df">*</span></label><input id="alert-title" name="title" maxlength="180" required placeholder="Nhập tiêu đề cảnh báo" value="${edit?esc(a.title):''}"></div><div class="field"><label for="alert-content">Mô tả và hướng dẫn <span style="color:#52d1df">*</span></label><textarea id="alert-content" name="content" required maxlength="4000" placeholder="Mô tả tình hình mưa lớn, nguy cơ ngập và hướng dẫn dành cho Người dân…">${edit?esc(a.content):''}</textarea><div class="hint">Nội dung này sẽ hiển thị trong bản tin gửi tới Người dân.</div></div><div class="readonly-scope"><h4>${icon('layers')}Áp dụng cho tất cả các vùng trên bản đồ</h4><p>${edit?'Phạm vi bản tin được giữ theo dữ liệu các vùng của hệ thống.':'Tạo thành công sẽ bật bản tin và phát thông báo tới toàn bộ Người dân.'}</p>${chips()}</div><div class="detail-time"><div><small>THỜI ĐIỂM BẮT ĐẦU</small><b>${edit?esc(a.start):'Tự ghi khi tạo thành công'}</b></div><div><small>THỜI ĐIỂM KẾT THÚC</small><b>${edit&&a.end?esc(a.end):'Tự ghi khi Admin tắt'}</b></div></div><div id="form-error" class="form-error" role="alert"></div></form>`;footer=`<small>${edit?'Thời điểm bắt đầu được giữ nguyên.':'Bản mẫu chỉ mô phỏng thao tác phát cảnh báo.'}</small><div class="actions"><button class="btn subtle" data-action="close-modal">Hủy</button><button class="btn primary" type="submit" form="alert-form">${edit?'Lưu nội dung':icon('bell')+'Tạo và phát cảnh báo'}</button></div>`;}else if(m==='stop'){small=true;kicker='KẾT THÚC BẢN TIN';title='Tắt cảnh báo này?';body=`<div class="danger-symbol">${icon('bell')}</div><p class="confirm-copy"><strong>${esc(a.title)}</strong><br><br>Hệ thống ghi thời điểm kết thúc và ngừng phát thêm thông báo, cảnh báo vị trí theo bản tin này.</p>`;footer=`<small>Giờ Việt Nam · GMT+7</small><div class="actions"><button class="btn subtle" data-action="close-modal">Giữ cảnh báo</button><button class="btn danger solid" data-action="confirm-stop">Tắt cảnh báo</button></div>`;}else if(m==='map'){kicker='TRA CỨU VÙNG';title='Các vùng trên bản đồ';body=`<div class="map-modal-art">${mapArt()}</div>${legend()}<div class="mobile-note">Bản tin: ${esc(a.title)}<br>Phạm vi đối chiếu gồm toàn bộ các vùng hệ thống đang cung cấp.</div>`;footer=`<small>Dữ liệu bản đồ minh họa</small><button class="btn primary" data-action="close-modal">Đóng bản đồ</button>`;}else{title='Chi tiết cảnh báo';kicker=state.role==='admin'?'ADMIN · QUẢN LÝ BẢN TIN':'RESCUE · THÔNG TIN CẢNH BÁO';body=`${pill(a)}<h2 class="detail-title">${esc(a.title)}</h2><div class="detail-time"><div><small>BẮT ĐẦU · GMT+7</small><b>${esc(a.start)}</b></div><div><small>KẾT THÚC · GMT+7</small><b>${a.end?esc(a.end):'Đang có hiệu lực'}</b></div></div><div class="detail-section"><h4>Nội dung cảnh báo</h4><p>${esc(a.content)}</p><h4>Phạm vi áp dụng</h4><p>Toàn bộ các vùng hệ thống đang cung cấp trên bản đồ.</p>${chips()}</div>`;footer=`<small>${esc(a.id)}</small><div class="actions">${state.role==='admin'&&a.active?'<button class="btn subtle" data-action="edit">'+icon('edit')+'Sửa nội dung</button><button class="btn danger" data-action="stop-selected">Tắt cảnh báo</button>':'<button class="btn map-btn" data-action="map-selected">'+icon('map')+'Xem bản đồ</button>'}<button class="btn" data-action="close-modal">Đóng</button></div>`;}root.innerHTML=`<div class="modal-backdrop"><section class="modal ${small?'small':''}" role="dialog" aria-modal="true" aria-label="${title}"><header class="modal-header"><div><div class="kicker">${kicker}</div><h2>${title}</h2></div><button class="close" aria-label="Đóng" data-action="close-modal">${icon('close')}</button></header><div class="modal-body">${body}</div><footer class="modal-footer">${footer}</footer></section></div>`;}
let toastTimer;function toast(message){clearTimeout(toastTimer);document.getElementById('toast-root').innerHTML=`<div class="toast">${icon('check')}<span>${esc(message)}</span></div>`;toastTimer=setTimeout(()=>document.getElementById('toast-root').innerHTML='',4200);}
function goRoute(route){if(state.route!==route)state.routeHistory.push(state.route);state.route=route;render();}
function switchRole(role){state.routeHistory=[];state.role=role;state.route=role==='resident'?'home':'list';state.filter='all';state.query='';state.modal=null;render();history.replaceState(null,'','#'+role);}
function stopAlert(a){if(!a||!a.active)return;a.active=false;a.end=now();state.modal=null;render();toast('Đã tắt bản tin. Thời điểm kết thúc đã được ghi nhận.');}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.role){switchRole(b.dataset.role);return;}if(b.dataset.filter){state.filter=b.dataset.filter;render();return;}if(b.dataset.detail){state.selected=b.dataset.detail;state.modal='detail';renderModal();return;}if(b.dataset.stop){state.selected=b.dataset.stop;state.modal='stop';renderModal();return;}if(b.dataset.map){state.selected=b.dataset.map;state.modal='map';renderModal();return;}if(b.dataset.mobileDetail){state.selected=b.dataset.mobileDetail;goRoute('detail');return;}if(b.dataset.gps){state.gps=b.dataset.gps;if(state.gps==='near')state.distance=320;if(state.gps==='far')state.distance=780;render();return;}if(b.dataset.distance){state.distance=Number(b.dataset.distance);state.gps=state.distance<=500?'near':'far';render();return;}const act=b.dataset.action;if(!act)return;switch(act){case'reset':state.alerts=initial();state.route=state.role==='resident'?'home':'list';state.filter='all';state.query='';state.gps='near';state.distance=320;state.zone='low';state.modal=null;render();toast('Đã khôi phục dữ liệu mẫu.');break;case'create':state.modal='create';renderModal();break;case'close-modal':state.modal=null;renderModal();break;case'edit':state.modal='edit';renderModal();break;case'stop-selected':state.modal='stop';renderModal();break;case'confirm-stop':stopAlert(selected());break;case'map-selected':state.modal='map';renderModal();break;case'refresh':render();toast('Đã cập nhật bản tin trong bản mẫu.');break;case'mobile-home':state.route='home';render();break;case'mobile-list':state.route='list';state.filter='all';render();break;case'mobile-back':state.route=state.routeHistory.pop()||(state.role==='resident'?'home':'list');render();break;case'mobile-map':goRoute('map');break;case'open-current-detail':state.selected=(current()||state.alerts[0]).id;goRoute('detail');break;case'enable-gps':state.gps='near';state.distance=320;render();toast('Đã mô phỏng cập nhật GPS hiện tại.');break;case'simulate-stop':if(current())stopAlert(current());else{state.alerts=initial();render();toast('Đã khôi phục bản tin đang bật.');}break;case'overview':state.route='list';render();toast('Trong bản duyệt này, lối vào Tổng quan dẫn tới Cảnh báo lũ.');break;case'sos':toast('Lối vào SOS hiện có của hệ thống. Bản mẫu đang tập trung vào Cảnh báo lũ.');break;case'shelter':toast('Lối vào Điểm tránh trú hiện có của hệ thống.');break;case'settings':case'account':toast('Khu vực tài khoản và cài đặt hiện có của hệ thống.');break;}});
document.addEventListener('submit',e=>{if(e.target.id!=='alert-form')return;e.preventDefault();const fd=new FormData(e.target);const title=String(fd.get('title')||'').trim(),content=String(fd.get('content')||'').trim();if(!title||!content){document.getElementById('form-error').textContent='Vui lòng nhập đầy đủ tiêu đề và mô tả.';return;}if(state.modal==='edit'){selected().title=title;selected().content=content;state.modal=null;render();toast('Đã lưu nội dung bản tin.');}else{const a={id:'FG-DEMO-'+Date.now().toString().slice(-6),title,content,active:true,start:now(),end:null};state.alerts.unshift(a);state.selected=a.id;state.modal=null;state.filter='all';render();toast('Tạo thành công. Đã mô phỏng phát bản tin tới toàn bộ Người dân.');}});
document.addEventListener('input',e=>{if(e.target.id==='search'){state.query=e.target.value;const start=e.target.selectionStart;render();const f=document.getElementById('search');f.focus();f.setSelectionRange(start,start);}if(e.target.id==='distance'){state.distance=Number(e.target.value);state.gps=state.distance<=500?'near':'far';const phoneMain=document.querySelector('.phone-main');const top=phoneMain?.scrollTop||0;const col=document.querySelector('.phone-column');col.outerHTML=phone(true);document.querySelector('.phone-main').scrollTop=top;const n=e.target.parentElement.querySelector('span');n.textContent=state.distance+' m';document.querySelectorAll('[data-gps]').forEach(b=>b.classList.toggle('active',b.dataset.gps===state.gps));const p=document.querySelector('.phone-push');if(p)p.outerHTML=pushPreview();}});
document.addEventListener('change',e=>{if(e.target.id==='zone-select'){state.zone=e.target.value;render();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal){state.modal=null;renderModal();}});
const initialRole=location.hash.slice(1);if(roles.some(r=>r.id===initialRole)){state.role=initialRole;state.route=initialRole==='resident'?'home':'list';}render();
})();
</script>
</body></html>
